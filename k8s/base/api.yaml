apiVersion: v1
kind: Service
metadata:
  name: pulsedock-api
  labels:
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4321
      targetPort: 4321
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsedock-api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/no749ah/pulsedock-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4321
              name: http
          envFrom:
            - configMapRef:
                name: pulsedock-config
            - secretRef:
                name: pulsedock-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4321
            initialDelaySeconds: 12
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4321
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 600m
              memory: 768Mi
