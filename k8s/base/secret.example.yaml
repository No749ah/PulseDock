apiVersion: v1
kind: Secret
metadata:
  name: pulsedock-secrets
  labels:
    app.kubernetes.io/component: secrets

type: Opaque
stringData:
  # Change all values before applying.
  POSTGRES_PASSWORD: "replace-with-strong-password"
  JWT_ACCESS_SECRET: "replace-with-hex-32-bytes"
  JWT_REFRESH_SECRET: "replace-with-hex-32-bytes"
  DEFAULT_ADMIN_EMAIL: "admin@example.com"
  DEFAULT_ADMIN_PASSWORD: "ChangeMe123!"
  DATABASE_URL: "postgresql://pulsedock:replace-with-strong-password@postgres:5432/pulsedock?schema=public"
