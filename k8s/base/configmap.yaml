apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsedock-config
  labels:
    app.kubernetes.io/component: config

data:
  NODE_ENV: production
  API_PORT: "4321"
  WEB_PORT: "1234"
  APP_BASE_URL: "https://status.example.com"
  ALLOW_PUBLIC_REGISTRATION: "false"
  INTERNAL_API_URL: "http://pulsedock-api:4321"

  # API database wiring for internal service discovery.
  POSTGRES_DB: pulsedock
  POSTGRES_USER: pulsedock
