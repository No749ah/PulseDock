version: '3.9'

# Production Docker Compose for PulseDock
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env.prod):
#   POSTGRES_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, API_PORT, WEB_PORT

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsedock}
      POSTGRES_USER: ${POSTGRES_USER:-pulsedock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsedock}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsedock

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsedock}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pulsedock}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      API_PORT: ${API_PORT:-4321}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
    ports:
      - "${API_PORT:-4321}:4321"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4321/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - pulsedock

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4321}
      WEB_PORT: ${WEB_PORT:-1234}
    ports:
      - "${WEB_PORT:-1234}:1234"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1234/login || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - pulsedock

volumes:
  postgres_data:

networks:
  pulsedock:
    driver: bridge
