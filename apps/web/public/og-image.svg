  <text x="165" y="423" text-anchor="middle" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#5EE2B0">Open Source</text>

  <rect x="248" y="400" width="130" height="36" rx="18" fill="#0f2f25" stroke="#1f5a46" stroke-width="1"/>
  <text x="313" y="423" text-anchor="middle" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#5EE2B0">Self-Hosted</text>

  <rect x="396" y="400" width="160" height="36" rx="18" fill="#0f2f25" stroke="#1f5a46" stroke-width="1"/>
  <text x="476" y="423" text-anchor="middle" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#5EE2B0">For Developers</text>

  <!-- Right side decorative card -->
  <rect x="720" y="150" width="380" height="280" rx="16" fill="#0d1e1a" stroke="#1f5a46" stroke-width="1"/>
  <!-- Card header -->
  <rect x="720" y="150" width="380" height="48" rx="16" fill="#0f2f25"/>
  <rect x="720" y="174" width="380" height="24" fill="#0f2f25"/>
  <circle cx="752" cy="174" r="7" fill="#ef4444"/>
  <circle cx="774" cy="174" r="7" fill="#f59e0b"/>
  <circle cx="796" cy="174" r="7" fill="#22c55e"/>
  <!-- Card rows -->
  <rect x="748" y="228" width="120" height="12" rx="4" fill="#1f5a46"/>
  <rect x="748" y="256" width="80" height="12" rx="4" fill="#1f4a3a"/>
  <rect x="748" y="284" width="140" height="12" rx="4" fill="#1f5a46"/>
  <rect x="748" y="312" width="60" height="12" rx="4" fill="#1f4a3a"/>
  <rect x="748" y="340" width="110" height="12" rx="4" fill="#1f5a46"/>
  <!-- Status dots -->
  <circle cx="1070" cy="234" r="5" fill="#5EE2B0"/>
  <circle cx="1070" cy="262" r="5" fill="#ef4444"/>
  <circle cx="1070" cy="290" r="5" fill="#5EE2B0"/>
  <circle cx="1070" cy="318" r="5" fill="#5EE2B0"/>
  <circle cx="1070" cy="346" r="5" fill="#f59e0b"/>
