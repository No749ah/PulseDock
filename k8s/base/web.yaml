apiVersion: v1
kind: Service
metadata:
  name: pulsedock-web
  labels:
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 1234
      targetPort: 1234
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsedock-web
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/no749ah/pulsedock-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1234
              name: http
          envFrom:
            - configMapRef:
                name: pulsedock-config
            - secretRef:
                name: pulsedock-secrets
          readinessProbe:
            httpGet:
              path: /login
              port: 1234
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 1234
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
