apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pulsedock.fullname" . }}-config
  namespace: {{ include "pulsedock.namespace" . }}
  labels:
    {{- include "pulsedock.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  API_PORT: {{ .Values.api.port | quote }}
  WEB_PORT: {{ .Values.web.port | quote }}

  ALLOW_PUBLIC_REGISTRATION: {{ .Values.config.allowPublicRegistration | quote }}

  # API URL — consumed by the web frontend
  {{- $apiUrl := include "pulsedock.apiUrl" . }}
  {{- if $apiUrl }}
  API_URL: {{ $apiUrl | quote }}
  INTERNAL_API_URL: {{ printf "http://%s-api:%d" (include "pulsedock.fullname" .) (int .Values.api.port) | quote }}
  {{- end }}

  {{- if .Values.config.nextPublicApiUrl }}
  NEXT_PUBLIC_API_URL: {{ .Values.config.nextPublicApiUrl | quote }}
  {{- else if $apiUrl }}
  NEXT_PUBLIC_API_URL: {{ $apiUrl | quote }}
  {{- end }}

  {{- if .Values.postgres.enabled }}
  # PostgreSQL connection details for the DB init container / postgres env
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  {{- end }}
